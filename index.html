.wrap { max-width: 1200px; margin: 0 auto; padding: 40px 24px 80px; }

header.hero {

}

.stat-row {

}
.stat {

}
.stat .v { font-size: 22px; font-weight: 600; color: var(--ink); font-feature-settings: 'tnum'; }
.stat .l { font-size: 12px; color: var(--muted); margin-top: 2px; }

.toolbar {

  background: var(--panel); border: 1px solid var(--line);

  box-shadow: 0 2px 8px -6px rgba(20,23,30,.06);
}
.toolbar input.search {

.card {

.count-line {

footer {

const $ = (s) => document.querySelector(s);
const $$ = (s) => document.querySelectorAll(s);

let audience = 'all';
let series = 'all';
let keyword = '';
let sortBy = 'date_desc';

function fmtDate(s) { return s.slice(0, 10); }
function fmtNum(n) { return n.toLocaleString('en-US'); }
function escHtml(s) {
  if (!s) return '';
  return s.replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function passes(p) {
  if (audience !== 'all' && p.audience !== audience) return false;
  if (series !== 'all' && p._series !== series) return false;
  if (keyword) {
    const k = keyword.toLowerCase();
    const hay = (p.title + ' ' + (p.description || '') + ' ' + (p.postTags || []).map(t => t.name).join(' ')).toLowerCase();
    if (!hay.includes(k)) return false;
  }
  return true;
}

function sortPosts(arr) {
  const a = [...arr];
  switch (sortBy) {
    case 'date_asc': a.sort((x, y) => x.post_date.localeCompare(y.post_date)); break;
    case 'words_desc': a.sort((x, y) => (y.wordcount||0) - (x.wordcount||0)); break;
    case 'words_asc': a.sort((x, y) => (x.wordcount||0) - (y.wordcount||0)); break;
    case 'title_asc': a.sort((x, y) => x.title.localeCompare(y.title, 'zh')); break;
    default: a.sort((x, y) => y.post_date.localeCompare(x.post_date));
  }
  return a;
}

function render() {
  const filtered = sortPosts(DATA.posts.filter(passes));
  $('#countLine').innerHTML = `顯示 <strong>${filtered.length}</strong> / ${DATA.posts.length} 篇`;
  const grid = $('#cards');
  if (filtered.length === 0) {
    grid.innerHTML = '';
    $('#empty').style.display = 'block';
    return;
  }
  $('#empty').style.display = 'none';
  grid.innerHTML = filtered.map(p => {
    const audClass = p.audience === 'everyone' ? 'free' : 'paid';
    const audLabel = p.audience === 'everyone' ? '🆓 公開' : '💎 付費';
    const pdfLink = p._filename ? `PDF/${p._filename}` : (p._dir ? `content/${p._dir}/article.pdf` : '');
    if (p._dir && !p._filename) {
        // Derive the PDF filename the same way rename_pdfs.py does
        const audCode = p.audience === 'everyone' ? 'free' : 'paid';
        p._filename = `${p.post_date.slice(0,10)}_${audCode}_${(p.title || '').replace(/[\\/:*?"<>|]/g, '_').replace(/\s+/g, '-').replace(/-+/g, '-').replace(/^[-_.]+|[-_.]+$/g, '').slice(0,100)}.pdf`;
    }
    const originalLink = p.canonical_url || `https://www.fomosoc.com/p/${p.slug}`;
    const desc = p.description || '';
    const tags = (p.postTags || []).map(t => t.name).join(' • ');
    return `
      <div class="card" data-id="${p.id}">
        <div class="card-tags">
          <span class="tag ${audClass}">${audLabel}</span>
          <span class="tag series">${escHtml(p._series)}</span>
        </div>
        <h3>${escHtml(p.title)}</h3>
        <div class="desc">${escHtml(desc)}</div>
        <div class="meta">
          <span>📅 ${fmtDate(p.post_date)}</span>
          <span>📝 ${fmtNum(p.wordcount || 0)} 字</span>
          <span>🖼 ${p._image_count} 圖</span>
          ${p._article_size > 0 ? `<span>💾 ${Math.round(p._article_size/1024)} KB</span>` : ''}
        </div>
        <div class="actions">
          ${p._filename
            ? `<a class="primary pdf" href="${pdfLink}">📑 讀 PDF</a>`
            : `<span style="color:var(--muted);font-size:12px;">未抓取</span>`}
          <a href="${originalLink}" target="_blank" rel="noopener">↗ 原站</a>
        </div>
      </div>
    `;
  }).join('');
}

$('#search').addEventListener('input', (e) => {
  keyword = e.target.value.trim();
  render();
});

$$('#audienceChips .chip').forEach(c => c.addEventListener('click', () => {
  $$('#audienceChips .chip').forEach(x => x.classList.remove('active'));
  c.classList.add('active');
  audience = c.dataset.aud;
  render();
}));

$$('#seriesChips .chip').forEach(c => c.addEventListener('click', () => {
  $$('#seriesChips .chip').forEach(x => x.classList.remove('active'));
  c.classList.add('active');
  series = c.dataset.series;
  render();
}));

$('#sortSelect').addEventListener('change', (e) => {
  sortBy = e.target.value;
  render();
});

// Initial render
$('#statTotal').textContent = DATA.total;
$('#statFree').textContent = DATA.by_audience.everyone || 0;
$('#statPaid').textContent = DATA.by_audience.only_paid || 0;
$('#statImages').textContent = fmtNum(DATA.total_images);
$('#statWords').textContent = fmtNum(DATA.total_words);
$('#statRange').textContent = DATA.date_range[0].slice(2) + ' ~ ' + DATA.date_range[1].slice(2);
$('#genTime').textContent = new Date().toLocaleString('zh-TW');
render();
</script>
